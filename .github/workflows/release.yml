name: Build and release desktop apps

on:
  push:
    branches: [nightly]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    if: contains(fromJSON('["nightly", "beta", "stable"]'), github.ref_name) && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ github.ref_name }}
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      version: ${{ steps.bump.outputs.version }}
      commit: ${{ steps.bump.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test release scripts
        run: node --test updates/*.test.cjs

      - name: Check for code changes since the last published channel release
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            | jq -s 'add' > "${RUNNER_TEMP}/channel-releases.json"
          baseline="$(jq -r --arg channel "${CHANNEL}" 'map(select(.draft == false and (if $channel == "stable" then .prerelease == false else .prerelease == true and (.tag_name | contains("-" + $channel + ".")) end))) | .[0].tag_name // empty' "${RUNNER_TEMP}/channel-releases.json")"
          stable_version="$(jq -r 'map(select(.draft == false and .prerelease == false)) | .[0].tag_name // empty' "${RUNNER_TEMP}/channel-releases.json")"
          beta_version="$(jq -r 'map(select(.draft == false and .prerelease == true and (.tag_name | contains("-beta.")))) | .[0].tag_name // empty' "${RUNNER_TEMP}/channel-releases.json")"
          echo "STABLE_VERSION=${stable_version}" >> "$GITHUB_ENV"
          echo "BETA_VERSION=${beta_version}" >> "$GITHUB_ENV"
          if [ -z "${baseline}" ]; then
            baseline="$(git tag --list 'v*' --sort=-version:refname | sed -n '/^v[0-9]*\.[0-9]*\.[0-9]*$/p' | sed -n '1p')"
          fi
          changed="$(node updates/has-code-changes.cjs "${baseline}" HEAD)"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          if [ "${changed}" = "false" ]; then
            echo "No code changes since ${baseline}; version bump and release skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set channel version and tag the release
        id: bump
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          version="$(node updates/bump-version.cjs "--${CHANNEL}" "${GITHUB_RUN_NUMBER}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/config.yml build/windows/info.json build/windows/nsis/wails_tools.nsh build/linux/nfpm/nfpm.yaml frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${version} [skip ci]"
          fi
          git tag "v${version}"
          git push --atomic origin "HEAD:${CHANNEL}" "refs/tags/v${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (Test-Path $nsisPath) {
            $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Test application updater
        run: go test ./updates

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: wails3 task windows:package ARCH=amd64 INSTALL_SCOPE=user

      - name: Build Linux Debian package
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          wails3 task linux:create:deb ARCH=amd64
          mv bin/depmanager.deb "bin/depmanager_${VERSION}_amd64.deb"

      - name: Upload Windows release asset
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: bin/*amd64-installer.exe
          if-no-files-found: error

      - name: Upload Linux release asset
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: bin/*.deb
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ github.ref_name }}
        run: |
          (cd release-assets && sha256sum *.exe *.deb > SHA256SUMS)
          release_flags=(--prerelease --latest=false)
          if [ "${CHANNEL}" = "stable" ]; then
            release_flags=(--latest=true)
          fi
          gh release create "v${VERSION}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DepManager ${CHANNEL^} v${VERSION}" \
            "${release_flags[@]}" \
            --generate-notes \
            --verify-tag
