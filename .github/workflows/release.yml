name: Build and release nightly apps

on:
  push:
    branches: [nightly]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-nightly
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/nightly' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      version: ${{ steps.bump.outputs.version }}
      commit: ${{ steps.bump.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nightly
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test release scripts
        run: node --test updates/*.test.cjs

      - name: Check for code changes since the last published nightly
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == true) | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.")) | .tag_name' \
            > "${RUNNER_TEMP}/nightly-release-tags.txt"
          baseline="$(sed -n '1p' "${RUNNER_TEMP}/nightly-release-tags.txt")"
          if [ -z "${baseline}" ]; then
            baseline="$(git tag --list 'v*' --sort=-version:refname | sed -n '/^v[0-9]*\.[0-9]*\.[0-9]*$/p' | sed -n '1p')"
          fi
          changed="$(node updates/has-code-changes.cjs "${baseline}" HEAD)"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          if [ "${changed}" = "false" ]; then
            echo "No code changes since ${baseline}; version bump and release skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Bump nightly version and tag the release
        id: bump
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          version="$(node updates/bump-version.cjs --nightly "${GITHUB_RUN_NUMBER}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/config.yml build/windows/info.json build/windows/nsis/wails_tools.nsh build/linux/nfpm/nfpm.yaml frontend/package.json frontend/package-lock.json
          git commit -m "chore(release): v${version} [skip ci]"
          git tag "v${version}"
          git push --atomic origin HEAD:nightly "refs/tags/v${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.commit }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails CLI (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (Test-Path $nsisPath) {
            $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Test application updater
        run: go test ./updates

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        run: wails3 task windows:package ARCH=amd64 INSTALL_SCOPE=user

      - name: Build Linux Debian package
        if: matrix.platform == 'linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          wails3 task linux:create:deb ARCH=amd64
          mv bin/depmanager.deb "bin/depmanager_${VERSION}_amd64.deb"

      - name: Upload Windows release asset
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: bin/*amd64-installer.exe
          if-no-files-found: error

      - name: Upload Linux release asset
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: bin/*.deb
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd release-assets && sha256sum *.exe *.deb > SHA256SUMS)
          gh release create "v${VERSION}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DepManager Nightly v${VERSION}" \
            --prerelease \
            --latest=false \
            --generate-notes \
            --verify-tag
